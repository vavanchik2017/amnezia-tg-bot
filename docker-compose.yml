version: '3.3'

services:
  amnezia-bot:
    build: .
    container_name: amnezia-bot
    restart: unless-stopped
    volumes:
      # Access to Docker daemon to execute wg/awg commands in VPN container
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent storage for SQLite database and state
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bot.db
